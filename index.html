<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Downloader</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root{
--bg:#000;--text:#fff;--muted:#aaa;
--primary:#1DB954;--secondary:#AD4AE7;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{
background:
radial-gradient(circle at 20% 20%,rgba(255,255,255,.1),transparent 30%),
radial-gradient(circle at 80% 10%,rgba(255,255,255,.08),transparent 25%),
radial-gradient(circle at 50% 90%,rgba(255,255,255,.05),transparent 30%),
var(--bg);
color:var(--text);min-height:100vh;padding:20px;
}
.container{max-width:1100px;margin:auto}

.profile-wrapper{
width:150px;height:150px;border-radius:50%;
margin:0 auto 25px;padding:5px;
background:linear-gradient(135deg,var(--primary),var(--secondary));
box-shadow:0 0 25px rgba(173,74,231,.5);
animation:glow 4s infinite alternate
}
.profile-wrapper video{
width:100%;height:100%;border-radius:50%;object-fit:cover
}
@keyframes glow{
0%{box-shadow:0 0 15px var(--primary)}
100%{box-shadow:0 0 30px var(--secondary)}
}

.header{text-align:center;margin-bottom:30px}
.title{font-family:'Orbitron',sans-serif;font-size:36px;font-weight:800}
.subtitle{color:var(--muted)}

.section{
background:rgba(255,255,255,.05);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.15);
border-radius:18px;padding:28px;
margin-bottom:30px;position:relative
}
.section::before{
content:'';position:absolute;top:0;left:0;right:0;height:3px;
background:linear-gradient(90deg,var(--primary),var(--secondary))
}

.section-title{
font-family:'Orbitron',sans-serif;
font-size:22px;margin-bottom:20px;
display:flex;align-items:center;gap:10px
}

.label{margin-bottom:8px;font-weight:600;color:#ddd}
.input{
width:100%;padding:12px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.2);
border-radius:12px;color:#fff;margin-bottom:10px
}

.btn{
width:100%;padding:14px;
background:linear-gradient(135deg,var(--primary),var(--secondary));
border:none;border-radius:12px;
color:#fff;font-weight:bold;cursor:pointer
}

.loading{
display:none;margin-top:15px;
color:var(--secondary);text-align:center
}

.result-area{display:none}
.result-area img{
max-width:100%;border-radius:12px;margin-top:15px
}

audio{
width:100%;
margin-top:15px;
}

.download{
display:inline-block;margin-top:15px;
color:#00ff88;font-weight:bold;text-decoration:none
}
</style>
</head>

<body>
<div class="container">

<div class="profile-wrapper">
<video src="https://files.catbox.moe/84lt73.mp4" autoplay loop muted playsinline></video>
</div>

<div class="header">
<h1 class="title">Spotify Downloader</h1>
<p class="subtitle">Powered By Aliftzycrt🍓</p>
</div>

<div class="section">
<h2 class="section-title">
<i class="fab fa-spotify"></i> Download Lagu Spotify
</h2>

<label class="label">
<i class="fas fa-link"></i> Link Spotify
</label>
<input type="text" id="slink" class="input" placeholder="Tempel link Spotify di sini...">

<button class="btn" onclick="downloadSpotify()">
<i class="fas fa-download"></i> Ambil Lagu
</button>

<div class="loading" id="loading">
<i class="fas fa-spinner fa-spin"></i> Mengambil lagu...
</div>
</div>

<div class="section result-area" id="resultArea">
<h2 class="section-title">
<i class="fas fa-check-circle"></i> Hasil Lagu
</h2>

<img id="cover">
<h3 id="title"></h3>
<p id="artist" style="color:#aaa;"></p>

<audio id="player" controls></audio>
<br>
<a id="download" class="download" target="_blank">
<i class="fas fa-download"></i> Download MP3
</a>
</div>

</div>

<script>
function downloadSpotify(){
const link=document.getElementById("slink").value;
if(!link){alert("Masukkan link Spotify dulu");return;}

loading.style.display="block";
resultArea.style.display="none";

fetch(`https://api.vreden.my.id/api/v1/download/spotify?url=${encodeURIComponent(link)}`)
.then(res=>res.json())
.then(data=>{
if(!data.status){alert("Gagal ambil lagu");return;}

cover.src=data.result.cover_url;
title.innerText=data.result.title;
artist.innerText=data.result.artists;
player.src=data.result.download;
download.href=data.result.download;

resultArea.style.display="block";
})
.catch(()=>alert("Terjadi kesalahan / CORS error"))
.finally(()=>loading.style.display="none");
}
</script>

</body>
</html>
